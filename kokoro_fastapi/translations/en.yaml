configuration:
  download_model:
    name: Download model at startup
    description: Download the Kokoro model when the app starts if it is not already available.
  api_log_level:
    name: API Log Level
    description: Choose how much detail Kokoro writes to the app log.
  default_voice:
    name: Default Voice (fallback only!)
    description: Voice used when a speech request does not specify one. Note: This setting here is overruled by your settings in the Kokoro-TTS HACS integration! 
  enable_web_player:
    name: Enable Web UI
    description: Serve Kokoro's browser-based web player. Open it with the Open Web UI link on the Kokoro app page, or visit http://HOME_ASSISTANT_IP:8880/web directly.
  enable_ssml:
    name: Support SSML
    description: Enable Speech Synthesis Markup Language, including pauses and other supported speech controls. Disable this unless you need SSML input.
